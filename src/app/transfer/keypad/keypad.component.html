<div class="keypad-wrapper">
  <div class="code-dots">
    <span
      class="dot"
      *ngFor="let i of [].constructor(maxLength); let idx = index"
      [class.filled]="idx < code.length"
    ></span>
  </div>

  <input
    #codeInput
    type="password"
    inputmode="numeric"
    [attr.maxlength]="maxLength"
    [ngModel]="code"
    (ngModelChange)="onInput($event)"
    class="secret-input"
    placeholder="Saisir le code secret"
    autocomplete="one-time-code"
  />

  <div class="keypad-actions">
    <button class="btn-secondary" (click)="onClose()">Fermer</button>
    <button
      class="btn-primary"
      [disabled]="code.length < maxLength"
      (click)="onValidate()"
    >
      ✓ Valider
    </button>
  </div>
</div>
