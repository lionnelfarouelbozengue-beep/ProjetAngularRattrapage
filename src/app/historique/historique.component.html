<div class="historique-screen">
  <header class="transfer-header">
    <button class="back-btn" (click)="goBack()">←</button>
    <h2>Historique des transactions</h2>
  </header>

  <div class="transaction-item" *ngFor="let t of transactions()">
    <div class="transaction-info">
      <p class="transaction-title">{{ labelFor(t.type) }}</p>
      <p class="transaction-sub">{{ t.recipientName || t.recipient }}</p>
      <span class="status-badge" [ngClass]="t.status">{{ t.status }}</span>
    </div>
    <div class="transaction-right">
      <p class="transaction-amount" [class.negative]="t.amount < 0" [class.positive]="t.amount > 0">
        {{ t.amount > 0 ? '+' : '' }}{{ t.amount | number }} FCFA
      </p>
      <p class="transaction-date">{{ t.date | date:'dd/MM/yyyy HH:mm' }}</p>
    </div>
  </div>

  <p class="empty-state" *ngIf="transactions().length === 0">Aucune transaction pour le moment.</p>
</div>
